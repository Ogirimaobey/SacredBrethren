<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Registration | Sacred Brethren</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .wine-text { color: #800020; }
        .wine-bg { background-color: #800020; }
        .clean-card { background: white; border: 1px solid #e2e8f0; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 md:p-6">

    <!-- Top Navigation -->
    <div class="w-full max-w-2xl flex justify-between items-center mb-8">
        <a href="index.html" class="text-sm font-bold text-slate-500 hover:wine-text transition-colors flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i> Home
        </a>
        <span class="font-bold tracking-widest text-sm text-slate-900 flex items-center gap-2">
            <div class="w-6 h-6 wine-bg text-white flex items-center justify-center rounded-sm text-xs">S</div>
            SACRED BRETHREN
        </span>
    </div>

    <!-- Main Form Container -->
    <main class="w-full max-w-2xl clean-card rounded-2xl overflow-hidden relative">
        
        <!-- Header Banner -->
        <div class="wine-bg p-8 text-center text-white relative overflow-hidden">
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-white/10 rounded-full"></div>
            <div class="absolute -bottom-10 -left-10 w-24 h-24 bg-black/10 rounded-full"></div>
            
            <h1 class="text-3xl md:text-4xl font-black mb-2 relative z-10">THE BIBLE STUDY QUIZ</h1>
            <div class="inline-block bg-yellow-500 text-black px-4 py-1.5 rounded-full text-sm font-bold shadow-lg relative z-10 mt-2">
                WIN FROM THE ₦20,000 PRIZE POOL
            </div>
        </div>

        <!-- Form Section -->
        <div class="p-6 md:p-10 bg-white">
            <p class="text-slate-500 mb-8 text-center md:text-left text-sm md:text-base">
                We want to know our family better across all borders! Fill out this quick form to update your details in our database and proceed to the quiz.
            </p>

            <!-- 
              Note: For now, the form submission is intercepted by JavaScript at the bottom 
              to move you to the next screen. Later, we will add an API link here. 
            -->
            <form id="quizRegistrationForm" class="space-y-6">
                
                <div>
                    <label class="block text-sm font-bold mb-2 text-slate-700">Full Name</label>
                    <input type="text" id="fullName" required class="w-full bg-slate-50 border border-slate-200 p-4 rounded-lg focus:outline-none focus:border-[#800020] focus:bg-white transition-colors" placeholder="Enter your full name">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold mb-2 text-slate-700">Email Address</label>
                        <input type="email" id="email" required class="w-full bg-slate-50 border border-slate-200 p-4 rounded-lg focus:outline-none focus:border-[#800020] focus:bg-white transition-colors" placeholder="you@example.com">
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-2 text-slate-700">Phone Number</label>
                        <input type="tel" id="phone" required class="w-full bg-slate-50 border border-slate-200 p-4 rounded-lg focus:outline-none focus:border-[#800020] focus:bg-white transition-colors" placeholder="Enter your active number">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold mb-2 text-slate-700">Current Resident Address</label>
                    <input type="text" id="address" required class="w-full bg-slate-50 border border-slate-200 p-4 rounded-lg focus:outline-none focus:border-[#800020] focus:bg-white transition-colors" placeholder="City, State, Country">
                </div>

                <div>
                    <label class="block text-sm font-bold mb-2 text-slate-700 flex justify-between">
                        Prayer Request
                        <span class="text-slate-400 font-normal">(Optional)</span>
                    </label>
                    <textarea id="prayerRequest" rows="3" class="w-full bg-slate-50 border border-slate-200 p-4 rounded-lg focus:outline-none focus:border-[#800020] focus:bg-white transition-colors" placeholder="How can the brethren pray for you?"></textarea>
                </div>

                <button type="submit" class="w-full wine-bg text-white font-bold py-4 rounded-lg hover:bg-red-900 transition-colors shadow-lg shadow-red-900/20 flex items-center justify-center gap-2 text-lg mt-4">
                    Continue to Quiz <i class="fa-solid fa-arrow-right"></i>
                </button>
                <p class="text-center text-xs text-slate-400 mt-4"><i class="fa-solid fa-lock mr-1"></i> Your information is secure and for ministry purposes only.</p>
            </form>
        </div>
    </main>

    <!-- Script to handle page transition -->
    <script>
        document.getElementById('quizRegistrationForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Stop the page from reloading
            // In the future, we will send data to the backend API here.
            // For now, redirect to the briefing page:
            window.location.href = 'quiz-briefing.html';
        });
    </script>
</body>
</html>
